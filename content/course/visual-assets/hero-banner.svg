<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Commercial Heliculture Masterclass</title>
  <desc id="hero-desc">Course banner: gold title on deep forest green, with a faint grid of farming rack tiers and a line-art snail.</desc>
  <defs>
    <!-- Fades the rack grid in from left to right so it never sits behind the title -->
    <linearGradient id="grid-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1200" height="400" fill="url(#grid-fade)"/>
    </mask>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2D6A4F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1B4332" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#1B4332"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Geometric grid: structured farming tiers (shelves and rack posts) -->
  <g mask="url(#grid-mask)" stroke="#D4AF37" stroke-opacity="0.16" stroke-width="1">
      <line x1="520" y1="70" x2="1200" y2="70"/>
      <line x1="520" y1="125" x2="1200" y2="125"/>
      <line x1="520" y1="180" x2="1200" y2="180"/>
      <line x1="520" y1="235" x2="1200" y2="235"/>
      <line x1="520" y1="290" x2="1200" y2="290"/>
      <line x1="520" y1="345" x2="1200" y2="345"/>
      <line x1="560" y1="0" x2="560" y2="400"/>
      <line x1="640" y1="0" x2="640" y2="400"/>
      <line x1="720" y1="0" x2="720" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
      <line x1="880" y1="0" x2="880" y2="400"/>
      <line x1="960" y1="0" x2="960" y2="400"/>
      <line x1="1040" y1="0" x2="1040" y2="400"/>
      <line x1="1120" y1="0" x2="1120" y2="400"/>
      <line x1="1200" y1="0" x2="1200" y2="400"/>
  </g>

  <!-- Gold rule and text block (left, text-safe area) -->
  <rect x="80" y="104" width="64" height="4" rx="2" fill="#D4AF37"/>
  <text x="80" y="186" fill="#D4AF37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-0.5">Commercial Heliculture</text>
  <text x="80" y="256" fill="#D4AF37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-0.5">Masterclass</text>
  <text x="80" y="308" fill="#F1F5EE" fill-opacity="0.85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400">From smallholder to professional snail farm · Snail World</text>

  <!-- Minimalist line-art snail -->
  <g fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
