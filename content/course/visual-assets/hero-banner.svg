8 241.9 L 1054.2 249.8 L 1049.7 257.3"/>
    <!-- Shell meets the foot -->
    <path d="M 1050.0 257.3 Q 1060 276 1056 291"/>
    <!-- Body / foot -->
    <path d="M 905 290 Q 960 300 1040 292 Q 1080 288 1092 262 Q 1100 236 1088 214"/>
    <path d="M 905 290 Q 893 290 890 282"/>
